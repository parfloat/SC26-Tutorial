<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: sans-serif; font-size: 11px; }
    .title { font-size: 14px; font-weight: bold; }
    .label { font-size: 10px; fill: #333; }
  </style>

  <text x="400.0" y="25" text-anchor="middle" class="title">FP16 Exception Repeats vs. SAMPLING Level (log scale)</text>
  <text x="400.0" y="42" text-anchor="middle" class="label" font-style="italic">rd_nixnan, cycle 1 of sampling_schedule.json -- cycle 2 is byte-identical (reset confirmed)</text>

  <line x1="70" y1="70" x2="70" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="330" x2="730" y2="330" stroke="#333" stroke-width="2"/>

  <text x="20" y="75" class="label">1M</text>
  <text x="20" y="205" class="label">1K</text>
  <text x="20" y="335" class="label">1</text>
  <line x1="65" y1="70" x2="730" y2="70" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="65" y1="200" x2="730" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- SAMPLING=1: NaN 60534, Inf 639 -->
  <rect x="120" y="122.8" width="30" height="207.2" fill="#ff9896" stroke="#333" stroke-width="1"/>
  <text x="135" y="117" text-anchor="middle" class="label">60,534</text>
  <rect x="155" y="208.4" width="30" height="121.6" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="170" y="203" text-anchor="middle" class="label">639</text>
  <text x="152.5" y="350" text-anchor="middle" class="label" font-weight="bold">SAMPLING=1</text>
  <text x="152.5" y="362" text-anchor="middle" class="label" font-size="9">(every call)</text>
  <text x="152.5" y="374" text-anchor="middle" class="label" font-size="9">22 NaN / 22 Inf unique sites</text>

  <!-- SAMPLING=2: NaN 30246, Inf 312 -->
  <rect x="280" y="135.8" width="30" height="194.2" fill="#ff9896" stroke="#333" stroke-width="1"/>
  <text x="295" y="130" text-anchor="middle" class="label">30,246</text>
  <rect x="315" y="221.9" width="30" height="108.1" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="330" y="216" text-anchor="middle" class="label">312</text>
  <text x="312.5" y="350" text-anchor="middle" class="label" font-weight="bold">SAMPLING=2</text>
  <text x="312.5" y="374" text-anchor="middle" class="label" font-size="9">22 NaN / 21 Inf unique sites</text>

  <!-- SAMPLING=4: NaN 15103, Inf 154 -->
  <rect x="440" y="148.9" width="30" height="181.1" fill="#ff9896" stroke="#333" stroke-width="1"/>
  <text x="455" y="143" text-anchor="middle" class="label">15,103</text>
  <rect x="475" y="235.2" width="30" height="94.8" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="490" y="229" text-anchor="middle" class="label">154</text>
  <text x="472.5" y="350" text-anchor="middle" class="label" font-weight="bold">SAMPLING=4</text>
  <text x="472.5" y="374" text-anchor="middle" class="label" font-size="9">22 NaN / 17 Inf unique sites</text>

  <!-- SAMPLING=8: NaN 7524, Inf 66 -->
  <rect x="600" y="162.0" width="30" height="168.0" fill="#ff9896" stroke="#333" stroke-width="1"/>
  <text x="615" y="156" text-anchor="middle" class="label">7,524</text>
  <rect x="635" y="251.2" width="30" height="78.8" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="650" y="245" text-anchor="middle" class="label">66</text>
  <text x="632.5" y="350" text-anchor="middle" class="label" font-weight="bold">SAMPLING=8</text>
  <text x="632.5" y="362" text-anchor="middle" class="label" font-size="9">(once in 8 calls)</text>
  <text x="632.5" y="374" text-anchor="middle" class="label" font-size="9">22 NaN / 17 Inf unique sites</text>

  <!-- Legend -->
  <rect x="600" y="90" width="15" height="15" fill="#ff9896" stroke="#333" stroke-width="1"/>
  <text x="620" y="102" class="label">NaN repeats</text>
  <rect x="600" y="110" width="15" height="15" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="620" y="122" class="label">Infinity repeats</text>

  <text x="400" y="400" text-anchor="middle" class="label" font-style="italic">
    Repeats halve with each doubling of SAMPLING (~1/N of launches observed); unique-site counts
  </text>
  <text x="400" y="412" text-anchor="middle" class="label" font-style="italic">
    stay near-constant for NaN but drop 22-&gt;21-&gt;17 for Infinity -- coarse sampling can miss rare sites entirely.
  </text>
</svg>
