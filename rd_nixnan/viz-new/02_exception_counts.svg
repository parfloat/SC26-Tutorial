<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: sans-serif; font-size: 11px; }
    .title { font-size: 14px; font-weight: bold; }
    .label { font-size: 10px; fill: #333; }
  </style>

  <text x="400.0" y="25" text-anchor="middle" class="title">Exception Propagation: NaN/Infinity Occurrences (log scale, M=1600)</text>

  <line x1="70" y1="70" x2="70" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="330" x2="730" y2="330" stroke="#333" stroke-width="2"/>

  <!-- log scale calibrated to axis: y=330 -> 1, y=200 -> 1K, y=70 -> 1M (43.33 px/decade) -->
  <text x="20" y="75" class="label">1M</text>
  <text x="20" y="205" class="label">1K</text>
  <text x="20" y="335" class="label">1</text>
  <line x1="65" y1="70" x2="730" y2="70" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="65" y1="200" x2="730" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- FP16: NaN 22 unique + 60534 repeats = 60556 total; Infinity 22 + 639 = 661 total; Subnormal 0 -->
  <rect x="330" y="122.8" width="25" height="207.2" fill="#ff9896" stroke="#333" stroke-width="1"/>
  <text x="342.5" y="117" text-anchor="middle" class="label">60,556</text>
  <rect x="360" y="207.8" width="25" height="122.2" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="372.5" y="202" text-anchor="middle" class="label">661</text>
  <text x="402.5" y="343" text-anchor="middle" class="label" font-style="italic">0</text>

  <!-- BF16: all zero (never overflows within M=1600) -->
  <text x="592.5" y="325" text-anchor="middle" class="label" font-style="italic">0 / 0 / 0</text>
  <text x="592.5" y="337" text-anchor="middle" class="label" font-style="italic" font-size="9">(still finite at step 1600)</text>

  <!-- FP32: all zero (never overflows within M=1600) -->
  <text x="812.5" y="325" text-anchor="middle" class="label" font-style="italic">0 / 0 / 0</text>
  <text x="812.5" y="337" text-anchor="middle" class="label" font-style="italic" font-size="9">(still finite at step 1600)</text>

  <!-- Legend -->
  <rect x="580" y="80" width="15" height="15" fill="#ff9896" stroke="#333" stroke-width="1"/>
  <text x="600" y="92" class="label">NaN</text>
  <rect x="580" y="100" width="15" height="15" fill="#d62728" stroke="#333" stroke-width="1"/>
  <text x="600" y="112" class="label">Infinity</text>
  <rect x="580" y="120" width="15" height="15" fill="#8c564b" stroke="#333" stroke-width="1"/>
  <text x="600" y="132" class="label">Subnormal</text>
  <text x="372.5" y="350" text-anchor="middle" class="label" font-weight="bold">FP16</text>
  <text x="592.5" y="350" text-anchor="middle" class="label" font-weight="bold">BF16</text>
  <text x="812.5" y="350" text-anchor="middle" class="label" font-weight="bold">FP32</text>
</svg>
